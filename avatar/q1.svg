<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080"><rect width="1080" height="1080" fill="#0A7A45"/>
    <defs>
      <clipPath id="cima-q1"><rect x="0" y="0" width="1080" height="560"/></clipPath>
      <clipPath id="baixo-q1"><rect x="0" y="594" width="1080" height="486"/></clipPath>
    </defs>
    <g transform="translate(540,540) scale(1.3) translate(-535,-504)">
      <!-- O traço anda no raio r - casco/2, não em r. Centrado em r, a casca
           cresceria metade para fora e a cúpula ficaria maior do que é na
           silhueta cheia; assim o perfil externo é exatamente o mesmo da p4 e
           o vazio é escavado para dentro, que é o que se pediu. -->
      <circle cx="728" cy="560" r="102" fill="none" stroke="#fff"
              stroke-width="32" clip-path="url(#cima-q1)"/>
      <circle cx="352" cy="560" r="102" fill="none" stroke="#fff"
              stroke-width="32" clip-path="url(#baixo-q1)"/>
      <rect x="200" y="560" width="670" height="34" fill="#fff"/>
      <rect x="508" y="330" width="32" height="230" fill="#fff"/>
      <rect x="564" y="330" width="32" height="230" fill="#fff"/>
    </g></svg>